<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 관리자 대시보드</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0d0d1a; --card:#16162a; --border:#2a2a44; --accent:#c850c0; --accent2:#4158d0; --text:#e8e8f0; --muted:#7878a0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .wrap { width:360px; }
    .logo { text-align:center; margin-bottom:32px; }
    .logo-icon { width:56px;height:56px;border-radius:50%; background:linear-gradient(135deg,var(--accent2),var(--accent)); display:flex;align-items:center;justify-content:center; font-size:26px; margin:0 auto 12px; }
    .logo-name { font-size:18px;font-weight:700;color:var(--accent); }
    .logo-sub { font-size:12px;color:var(--muted);margin-top:4px; }
    .card { background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px; }
    .form-group { margin-bottom:14px; }
    label { display:block;font-size:12px;color:var(--muted);margin-bottom:6px; }
    input { width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 14px;font-size:14px;font-family:inherit;outline:none;transition:border .15s; }
    input:focus { border-color:var(--accent); }
    .btn { width:100%;padding:11px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px;transition:opacity .15s; }
    .btn:hover { opacity:.9; }
    .error { background:rgba(240,62,62,.12);border:1px solid rgba(240,62,62,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#f03e3e;margin-bottom:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-name">NIGHT Service</div>
      <div class="logo-sub">관리자 대시보드</div>
    </div>
    <div class="card">
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/login">
        <div class="form-group">
          <label>아이디</label>
          <input name="username" placeholder="관리자 아이디" required autofocus>
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input name="password" type="password" placeholder="비밀번호" required>
        </div>
        <button class="btn">로그인</button>
      </form>
    </div>
  </div>
</body>
</html>
