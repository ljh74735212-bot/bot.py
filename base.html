<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIGHT Service · Premium Seller</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d0d1a;
      --sidebar: #111124;
      --card: #16162a;
      --card2: #1c1c33;
      --accent: #c850c0;
      --accent2: #4158d0;
      --text: #e8e8f0;
      --muted: #7878a0;
      --border: #2a2a44;
      --success: #3ecf8e;
      --danger: #f03e3e;
      --warn: #f7b731;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    
    .sidebar {
      width: 200px; min-height: 100vh; background: var(--sidebar);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .sidebar-logo {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo .icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; margin-bottom: 8px;
    }
    .sidebar-logo .name { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .5px; }

    .sidebar-nav { flex: 1; padding: 12px 0; }
    .nav-label { font-size: 10px; color: var(--muted); padding: 8px 16px 4px; letter-spacing: 1px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px; font-size: 13px; color: var(--muted);
      text-decoration: none; cursor: pointer; border: none; background: none;
      width: 100%; transition: all .15s;
    }
    .nav-item:hover { color: var(--text); background: var(--card); }
    .nav-item.active { color: var(--accent); background: rgba(200,80,192,.1); border-left: 2px solid var(--accent); }
    .nav-item .ico { font-size: 15px; width: 20px; text-align: center; }

    .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
    .sidebar-footer a {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted); text-decoration: none; padding: 8px;
      border-radius: 6px; transition: all .15s;
    }
    .sidebar-footer a:hover { color: var(--danger); background: rgba(240,62,62,.1); }

    
    .main { margin-left: 200px; flex: 1; padding: 24px; min-height: 100vh; }
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; }

    
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .stat-card .ico { font-size: 22px; }
    .stat-card .label { font-size: 11px; color: var(--muted); }
    .stat-card .value { font-size: 20px; font-weight: 700; color: var(--accent); }

    
    .grid-2 { display: grid; grid-template-columns: 1fr 340px; gap: 14px; margin-bottom: 24px; }
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .panel-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; }

    
    .chart-filters { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-btn {
      padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border);
      background: none; color: var(--muted); font-size: 11px; cursor: pointer;
      font-family: inherit; transition: all .15s;
    }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 11px; }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--card2); }

    
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .badge-green { background: rgba(62,207,142,.15); color: var(--success); }
    .badge-red { background: rgba(240,62,62,.15); color: var(--danger); }
    .badge-yellow { background: rgba(247,183,49,.15); color: var(--warn); }
    .badge-purple { background: rgba(200,80,192,.15); color: var(--accent); }

    
    .btn {
      padding: 7px 14px; border-radius: 8px; border: none;
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all .15s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn-success { background: rgba(62,207,142,.2); color: var(--success); border: 1px solid var(--success); }
    .btn-success:hover { background: var(--success); color: #000; }
    .btn-danger { background: rgba(240,62,62,.2); color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 12px; color: var(--muted); }
    input, select, textarea {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 8px 12px; font-size: 13px; font-family: inherit;
      outline: none; transition: border .15s; width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 60px; }

    
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .empty .ico { font-size: 36px; margin-bottom: 10px; }
    .empty p { font-size: 13px; }

    
    @media (max-width: 900px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
    }
  
    .sidebar-logo .tag { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
    .toast { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .toast.ok  { background: rgba(62,207,142,.12); border: 1px solid rgba(62,207,142,.35); color: var(--success); }
    .toast.err { background: rgba(240,62,62,.12);  border: 1px solid rgba(240,62,62,.35);  color: var(--danger); }
    .actions { display: flex; gap: 6px; }
    .actions form { margin: 0; }
    .table-wrap { overflow-x: auto; }
    @media (max-width: 700px) {
      .sidebar { position: static; width: 100%; min-height: 0; flex-direction: row; flex-wrap: wrap; }
      .sidebar-nav { display: flex; flex-wrap: wrap; padding: 4px; }
      .nav-label, .sidebar-footer { display: none; }
      .nav-item { width: auto; padding: 8px 10px; }
      body { flex-direction: column; }
      .main { margin-left: 0; padding: 16px; }
      .form-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="icon">⚡</div>
      <div class="name">NIGHT Service</div>
      <div class="tag">Premium Seller</div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-label">MENU</div>
      <a href="/" class="nav-item {% if page=='dashboard' %}active{% endif %}"><span class="ico">📊</span> Dashboard</a>
      <a href="/products" class="nav-item {% if page=='products' %}active{% endif %}"><span class="ico">📦</span> Products</a>
      <a href="/charges" class="nav-item {% if page=='charges' %}active{% endif %}"><span class="ico">💰</span> Charges</a>
      <a href="/users" class="nav-item {% if page=='users' %}active{% endif %}"><span class="ico">👥</span> Users</a>
      <a href="/events" class="nav-item {% if page=='events' %}active{% endif %}"><span class="ico">🎁</span> Events</a>
      <a href="/guilds" class="nav-item {% if page=='guilds' %}active{% endif %}"><span class="ico">🏢</span> Servers</a>
      <a href="/settings" class="nav-item {% if page=='settings' %}active{% endif %}"><span class="ico">⚙️</span> Settings</a>
    </div>
    <div class="sidebar-footer">
      <a href="/logout">↩ Log out</a>
    </div>
  </nav>
  <main class="main">
    {% if msg %}<div class="toast ok">✅ {{ msg }}</div>{% endif %}
    {% if err %}<div class="toast err">⚠️ {{ err }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
